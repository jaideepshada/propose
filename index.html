<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #0f1115;
      --paper: #12141a;
      --panel: rgba(22, 25, 33, 0.65);
      --panel-hover: rgba(30, 33, 46, 0.8);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --faint: #475569;
      --line: rgba(255, 255, 255, 0.08);
      
      /* Dynamic Accent */
      --accent: #d7b56d;
      --accent-soft: color-mix(in srgb, var(--accent), transparent 85%);
      --accent-glow: color-mix(in srgb, var(--accent), transparent 70%);
      
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.15);
      --radius: 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background-color: var(--bg-base);
    }

    body {
      display: grid;
      place-items: stretch;
      background-image: 
        radial-gradient(circle at 15% 0%, var(--accent-soft), transparent 45%),
        radial-gradient(circle at 85% 100%, var(--accent-soft), transparent 45%);
      background-attachment: fixed;
      transition: background-image 0.8s ease-in-out;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: -1;
      pointer-events: none;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent), white 20%);
      outline-offset: 4px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 3vw, 2.5rem);
      transition: background-color 0.3s ease;
    }

    .topbar, .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: clamp(0.85rem, 1.6vw, 0.95rem);
      z-index: 10;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 1rem;
      height: 1rem;
      border: 3px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .session-note {
      text-align: right;
      font-weight: 500;
    }

    .focus {
      width: min(100%, 78rem);
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: clamp(1.5rem, 3vw, 3rem);
      padding: clamp(2rem, 5vh, 4.5rem) 0;
    }

    .task-shell {
      position: relative;
      display: grid;
      gap: clamp(1.2rem, 2.5vw, 2rem);
      background: var(--panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--line);
      border-radius: 32px;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      box-shadow: 
        0 32px 64px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .track-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.85rem;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 60%);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.4s ease;
    }

    .track-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .step-count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }

    .task-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.4rem, 6.5vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .timer-wrap {
      display: grid;
      gap: 1rem;
      padding-top: clamp(0.5rem, 1.5vw, 1.5rem);
    }

    .timer {
      color: var(--ink);
      font-family: 'JetBrains Mono', 'SFMono-Regular', monospace;
      font-size: clamp(5rem, 20vw, 14rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 60px var(--accent-glow);
      white-space: nowrap;
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    .timer.overtime {
      color: var(--danger);
      text-shadow: 0 0 60px var(--danger-soft);
    }

    .timer-caption {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.2rem;
      color: var(--muted);
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 500;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      70% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .status-pill.running {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      border-color: color-mix(in srgb, var(--accent), transparent 50%);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status-pill.overtime {
      border-color: color-mix(in srgb, var(--danger), transparent 50%);
      background: var(--danger-soft);
      color: var(--danger);
      animation: none;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(11rem, 15rem) minmax(14rem, 19rem);
      gap: 1rem;
      align-items: center;
      padding-top: 1rem;
    }

    .button {
      min-height: 4rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .button:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .button:active {
      transform: translateY(1px) scale(0.98);
    }

    .button.primary {
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 800;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .button.primary:hover {
      background: color-mix(in srgb, var(--accent), white 15%);
      box-shadow: 0 12px 32px var(--accent-glow);
    }
    
    .button.primary.running {
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    
    .button.primary.running:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .bottombar {
      align-items: end;
    }

    .progress {
      width: min(100%, 38rem);
      height: 0.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease, box-shadow 0.4s ease;
    }

    .reset-button {
      min-height: 2.6rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.4rem 0.85rem;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .reset-button:hover {
      color: var(--ink);
      background: rgba(255,255,255,0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .complete {
      width: min(100%, 64rem);
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: 1.5rem;
      padding: clamp(3rem, 8vh, 7rem) 0;
      min-height: 72vh;
      animation: fade-in 0.8s ease-out forwards;
    }

    .complete-kicker {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .complete h1 {
      margin: 0;
      font-size: clamp(3.5rem, 13vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .complete p {
      max-width: 44rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.1rem, 2vw, 1.25rem);
      line-height: 1.6;
    }

    .complete-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1.5rem;
    }

    .complete-actions .button {
      min-width: 14rem;
      padding: 0 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    .advance-flash {
      animation: settle 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes settle {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .app {
        padding: 1.2rem;
      }
      .topbar, .bottombar, .meta-row {
        align-items: flex-start;
      }
      .topbar, .bottombar {
        flex-direction: column;
      }
      .session-note {
        text-align: left;
      }
      .meta-row {
        flex-direction: column;
        gap: 1.2rem;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      .button {
        width: 100%;
      }
      .task-shell {
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar" aria-label="Session">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Flow</div>
      <div class="session-note" id="sessionNote"></div>
    </header>

    <section class="focus" id="taskView" aria-live="polite">
      <div class="task-shell" id="taskShell">
        <div class="meta-row">
          <div class="track-tag" id="trackTag"><span class="track-dot" aria-hidden="true"></span><span id="trackName"></span></div>
          <div class="step-count" id="stepCount"></div>
        </div>

        <h1 class="task-title" id="taskTitle"></h1>

        <div class="timer-wrap">
          <div class="timer" id="timer" aria-label="Remaining time">00:00</div>
          <div class="timer-caption">
            <span class="status-pill" id="statusPill"></span>
            <span id="durationNote"></span>
          </div>
        </div>

        <div class="controls" aria-label="Timer controls">
          <button class="button primary" type="button" id="startPauseButton">Start</button>
          <button class="button next" type="button" id="nextButton">Mark Done → Next</button>
        </div>
      </div>
    </section>

    <section class="complete hidden" id="completeView" aria-live="polite">
      <div class="complete-kicker">Day complete</div>
      <h1>Finish line.</h1>
      <p>You moved through the full sequence. Reset deliberately when you are ready to start a new day.</p>
      <div class="complete-actions">
        <button class="button" type="button" id="completeResetButton">Reset Day</button>
      </div>
    </section>

    <footer class="bottombar">
      <div class="progress" aria-label="Day progress"><div class="progress-fill" id="progressFill"></div></div>
      <button class="reset-button" type="button" id="resetButton">Reset Day</button>
    </footer>
  </main>

  <script>
    const TASKS = [
      { label: "Morning routine", track: "Rest", minutes: 60 },
      { label: "DSA — Block 1", track: "DSA", minutes: 105 },
      { label: "Break", track: "Rest", minutes: 15 },
      { label: "DSA — Block 2", track: "DSA", minutes: 75 },
      { label: "Break", track: "Rest", minutes: 15 },
      { label: "Backend — Block 1", track: "Backend", minutes: 135 },
      { label: "Lunch", track: "Rest", minutes: 45 },
      { label: "Optional power nap", track: "Rest", minutes: 20 },
      { label: "Backend — Block 2", track: "Backend", minutes: 120 },
      { label: "Break", track: "Rest", minutes: 15 },
      { label: "Backend — Block 3", track: "Backend", minutes: 105 },
      { label: "Break", track: "Rest", minutes: 15 },
      { label: "Security", track: "Security", minutes: 60 },
      { label: "Dinner", track: "Rest", minutes: 45 },
      { label: "Wind-down (no screens)", track: "Rest", minutes: 60 }
    ];

    const TRACK_STYLES = {
      DSA: { accent: "#60a5fa" },
      Backend: { accent: "#fbbf24" },
      Security: { accent: "#e879f9" },
      Rest: { accent: "#34d399" }
    };

    const STORAGE_KEY = "flow.timer.state.v1";
    const firstTaskSeconds = TASKS[0].minutes * 60;
    let state = loadState();
    let ticker = null;

    const app = document.getElementById("app");
    const taskView = document.getElementById("taskView");
    const completeView = document.getElementById("completeView");
    const taskShell = document.getElementById("taskShell");
    const sessionNote = document.getElementById("sessionNote");
    const trackName = document.getElementById("trackName");
    const stepCount = document.getElementById("stepCount");
    const taskTitle = document.getElementById("taskTitle");
    const timer = document.getElementById("timer");
    const statusPill = document.getElementById("statusPill");
    const durationNote = document.getElementById("durationNote");
    const startPauseButton = document.getElementById("startPauseButton");
    const nextButton = document.getElementById("nextButton");
    const resetButton = document.getElementById("resetButton");
    const completeResetButton = document.getElementById("completeResetButton");
    const progressFill = document.getElementById("progressFill");

    startPauseButton.addEventListener("click", toggleRunning);
    nextButton.addEventListener("click", advanceTask);
    resetButton.addEventListener("click", confirmResetDay);
    completeResetButton.addEventListener("click", confirmResetDay);

    document.addEventListener("keydown", (event) => {
      if (event.target && ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(event.target.tagName)) {
        return;
      }
      if (event.code === "Space" && !state.complete) {
        event.preventDefault();
        toggleRunning();
      }
      if (event.key === "Enter" && !state.complete) {
        event.preventDefault();
        advanceTask();
      }
    });

    window.addEventListener("beforeunload", persistState);
    
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (state.running && !state.complete) {
            const now = Date.now();
            const elapsed = Math.floor((now - state.lastTick) / 1000);
            if (elapsed > 0) {
              state.remainingSeconds -= elapsed;
              state.lastTick += elapsed * 1000;
              persistState();
              renderTimerOnly();
            }
        }
      }
    });

    render();
    syncTicker();

    function createFreshState() {
      return {
        currentIndex: 0,
        remainingSeconds: firstTaskSeconds,
        running: false,
        dayStartTimestamp: Date.now(),
        complete: false,
        lastTick: Date.now()
      };
    }

    function loadState() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!stored || typeof stored !== "object") {
          return createFreshState();
        }

        const currentIndex = Number.isInteger(stored.currentIndex) ? stored.currentIndex : 0;
        if (stored.complete === true || currentIndex >= TASKS.length) {
          return {
            currentIndex: TASKS.length,
            remainingSeconds: 0,
            running: false,
            dayStartTimestamp: Number(stored.dayStartTimestamp) || Date.now(),
            complete: true,
            lastTick: Date.now()
          };
        }

        if (currentIndex < 0 || currentIndex >= TASKS.length) {
          return createFreshState();
        }

        let remainingSeconds = Number.isFinite(stored.remainingSeconds)
          ? Math.trunc(stored.remainingSeconds)
          : TASKS[currentIndex].minutes * 60;
          
        let lastTick = Number(stored.lastTick) || Date.now();
        let running = stored.running === true;

        if (running) {
            const now = Date.now();
            const elapsed = Math.floor((now - lastTick) / 1000);
            if (elapsed > 0) {
                remainingSeconds -= elapsed;
                lastTick += elapsed * 1000;
            } else if (elapsed < 0) {
                lastTick = now;
            }
        }

        return {
          currentIndex,
          remainingSeconds,
          running,
          dayStartTimestamp: Number(stored.dayStartTimestamp) || Date.now(),
          complete: false,
          lastTick
        };
      } catch (error) {
        return createFreshState();
      }
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggleRunning() {
      state.running = !state.running;
      if (state.running) {
          state.lastTick = Date.now();
      }
      persistState();
      render();
      syncTicker();
    }

    function advanceTask() {
      state.running = false;
      state.currentIndex += 1;

      if (state.currentIndex >= TASKS.length) {
        state.complete = true;
        state.remainingSeconds = 0;
      } else {
        state.complete = false;
        state.remainingSeconds = TASKS[state.currentIndex].minutes * 60;
      }
      
      state.lastTick = Date.now();

      persistState();
      taskShell.classList.remove("advance-flash");
      void taskShell.offsetWidth;
      taskShell.classList.add("advance-flash");
      render();
      syncTicker();
    }

    function confirmResetDay() {
      const confirmed = window.confirm("Reset Flow and start again from task 1?");
      if (!confirmed) return;

      localStorage.removeItem(STORAGE_KEY);
      state = createFreshState();
      render();
      syncTicker();
    }

    function syncTicker() {
      if (ticker) {
        clearInterval(ticker);
        ticker = null;
      }

      if (!state.running || state.complete) {
        return;
      }

      ticker = setInterval(() => {
        const now = Date.now();
        const elapsed = Math.floor((now - state.lastTick) / 1000);
        if (elapsed > 0) {
          state.remainingSeconds -= elapsed;
          state.lastTick += elapsed * 1000;
          persistState();
          renderTimerOnly();
        }
      }, 250);
    }

    function render() {
      sessionNote.textContent = `Session started at ${formatClockTime(state.dayStartTimestamp)}`;

      if (state.complete) {
        app.style.setProperty("--accent", "#d7b56d");
        taskView.classList.add("hidden");
        completeView.classList.remove("hidden");
        progressFill.style.width = "100%";
        return;
      }

      const task = TASKS[state.currentIndex];
      const trackStyle = TRACK_STYLES[task.track] || TRACK_STYLES.Rest;
      app.style.setProperty("--accent", trackStyle.accent);

      taskView.classList.remove("hidden");
      completeView.classList.add("hidden");
      trackName.textContent = task.track;
      stepCount.textContent = `${state.currentIndex + 1} / ${TASKS.length}`;
      taskTitle.textContent = task.label;
      durationNote.textContent = `${task.minutes} minute block`;
      
      startPauseButton.textContent = state.running ? "Pause" : "Start";
      startPauseButton.setAttribute("aria-pressed", String(state.running));
      startPauseButton.classList.toggle("running", state.running);
      
      progressFill.style.width = `${Math.round((state.currentIndex / TASKS.length) * 100)}%`;
      renderTimerOnly();
    }

    function renderTimerOnly() {
      const overtime = state.remainingSeconds < 0;
      timer.textContent = formatDuration(state.remainingSeconds);
      timer.classList.toggle("overtime", overtime);
      
      statusPill.classList.toggle("overtime", overtime);
      statusPill.classList.toggle("running", state.running && !overtime);
      
      statusPill.textContent = overtime ? "Overtime" : state.running ? "Running" : "Paused";
      timer.setAttribute("aria-label", overtime ? "Overtime" : "Remaining time");
    }

    function formatDuration(totalSeconds) {
      const sign = totalSeconds < 0 ? "-" : "";
      const absoluteSeconds = Math.abs(totalSeconds);
      const minutes = Math.floor(absoluteSeconds / 60);
      const seconds = absoluteSeconds % 60;
      return `${sign}${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function formatClockTime(timestamp) {
      return new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(timestamp));
    }
  </script>
</body>
</html>
