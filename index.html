<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0708" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luv" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Only for you</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="scene door-scene" aria-label="A private message">
        <div class="door-light" aria-hidden="true"></div>
        <div class="door-copy">
          <p class="door-line">Luv, this is only for you.</p>
          <p class="door-hint">Hold. Don't let go.</p>
        </div>
      </section>
    </main>
    <button class="sound-toggle" type="button" aria-label="Turn sound on" aria-pressed="false">
      <span aria-hidden="true"></span>
    </button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
